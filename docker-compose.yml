# =============================================================================
# Bainboiler Docker Compose
# =============================================================================
# 用法：
#   1. 复制 .env.example 到 .env 并填入 Sanity 凭据
#      cp .env.example .env
#   2. 一次性构建 + 启动
#      docker compose up -d --build
#   3. 查看日志
#      docker compose logs -f web
#   4. 停止
#      docker compose down
# =============================================================================

services:
  # ---- Next.js 官网 ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: bainboiler/web:latest
    container_name: bainboiler-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Sanity Content Lake（云服务，本地不需要起 Sanity 后端）
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-2025-01-01}
      SANITY_API_READ_TOKEN: ${SANITY_API_READ_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.bainboiler.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/zh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - bainboiler

  # ---- Sanity Studio 编辑器 ----
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    image: bainboiler/studio:latest
    container_name: bainboiler-studio
    restart: unless-stopped
    # 默认不暴露端口，仅通过反向代理（nginx / caddy）访问
    # 取消下面这行注释可以直接在 localhost:3333 访问
    # ports:
    #   - "${STUDIO_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      SANITY_STUDIO_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      SANITY_STUDIO_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3333/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - bainboiler

networks:
  bainboiler:
    driver: bridge
