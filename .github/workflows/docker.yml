name: Build and Push to Aliyun ACR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-lhx0j8tk9kmxgf0x.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          no-cache: true
          tags: |
            crpi-lhx0j8tk9kmxgf0x.cn-hangzhou.personal.cr.aliyuncs.com/lost1kb/bainboiler-web:latest
            crpi-lhx0j8tk9kmxgf0x.cn-hangzhou.personal.cr.aliyuncs.com/lost1kb/bainboiler-web:1.0.0

      - name: Build and push studio
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.studio
          push: true
          no-cache: true
          tags: |
            crpi-lhx0j8tk9kmxgf0x.cn-hangzhou.personal.cr.aliyuncs.com/lost1kb/bainboiler-studio:latest
            crpi-lhx0j8tk9kmxgf0x.cn-hangzhou.personal.cr.aliyuncs.com/lost1kb/bainboiler-studio:1.0.0
